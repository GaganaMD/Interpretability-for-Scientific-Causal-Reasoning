model_name: Qwen/Qwen2.5-0.5B-Instruct
max_new_tokens: 128
do_sample: false
seed: 7

datasets:
  - data/generated/toxicity_vignettes.jsonl
  - data/generated/ablated_vignettes.jsonl
  - data/generated/renamed_vignettes.jsonl

prompt_types:
  - direct
  - mechanistic
  - confounding_aware
  - adversarial
  - minimal
  - counterfactual

output_dir: results

hidden_states:
  prompt_types:
    - mechanistic
    - confounding_aware
  save_mean_pool: true
  max_examples: 24

representation_analysis:
  baseline_prompt_type: mechanistic
  compare_prompt_types:
    - confounding_aware
    - adversarial
  include_variant_types:
    - original
    - renamed_terms
    - confounder_removed
    - mediator_removed
    - randomized_design
    - selection_bias_added
